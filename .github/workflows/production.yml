name: Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar (comentários, lint e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Código sem comentários
        run: npm run comments:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  publicar:
    name: Publicar no Railway
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar a CLI do Railway
        run: npm install -g @railway/cli

      - name: Conferir a configuração
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "::error::Falta o secret RAILWAY_TOKEN no ambiente production (token de projeto do Railway)."; exit 1; fi
          if [ -z "$RAILWAY_SERVICE" ]; then echo "::error::Falta a variável RAILWAY_SERVICE no ambiente production (nome do serviço do frontend no Railway)."; exit 1; fi

      - name: Enviar para o Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
